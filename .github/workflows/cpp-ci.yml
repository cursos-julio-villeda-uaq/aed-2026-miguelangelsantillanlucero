name: Pruebas C++ — Actividad 9

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actividad-09-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Actividad 9
        run: cmake -S actividad-09 -B actividad-09/build -DCMAKE_BUILD_TYPE=Release
      - name: Compilar Actividad 9
        run: cmake --build actividad-09/build --config Release --parallel 2
      - name: Ejecutar pruebas de Actividad 9
        run: ctest --test-dir actividad-09/build --output-on-failure
